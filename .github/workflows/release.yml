name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; the bundled npm may be older.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm -v

      - run: npm ci

      # Refuse to publish if the tag does not match the version in package.json.
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      # Authenticated by OIDC via the trusted publisher configured on npmjs.com,
      # so there is no NODE_AUTH_TOKEN here by design. Provenance is generated
      # automatically under trusted publishing — no --provenance flag needed.
      #
      # `prepublishOnly` re-runs the full build and test suite before upload.
      - run: npm publish --access public
