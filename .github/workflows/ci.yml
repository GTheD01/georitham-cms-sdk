name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches "engines": { "node": ">=20" }
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # `npm test` runs the build first, so this covers typechecking too.
      - run: npm test

      # The tarball is the actual deliverable — make sure it still packs.
      - run: npm pack --dry-run
